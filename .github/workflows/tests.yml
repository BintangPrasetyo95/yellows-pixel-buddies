name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # whisper / torch are intentionally NOT installed: both imports are optional in the app.
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests (excluding tests that drive the real desktop)
        run: python -m pytest -m "not desktop"

      # Code extracted / cleaned in Phases 5-8 must not swallow exceptions silently (plan 8.5): blocking.
      - name: Ruff blind-except rules (blocking for cleaned modules)
        run: python -m ruff check --select BLE001,S110 pink/ takeover_controller.py privacy.py update_security.py

      - name: Ruff (report only for the rest; see review finding M8)
        continue-on-error: true
        run: python -m ruff check .
